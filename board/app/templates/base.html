<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/board.css">
  <title>{% block title %}NightWorld board{% endblock %}</title>
</head>
<body>
  {% if not hide_nav %}
  <header class="top">
    <a class="brand" href="/">🌙<span class="word"> NightWorld</span></a>
    <nav>
      <a href="/cards/new" class="add">＋ Card</a>
      <a href="/tonight">Tonight</a>
      <a href="/epics">Epics</a>
      <a href="/activity">Log</a>
      <a href="/settings">Night</a>
    </nav>
  </header>
  {% endif %}
  <main>{% block main %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
